<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pale Blue Dot — Connections</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* --- Basic styling --- */
body { margin:0; font-family:Arial, sans-serif; background:#f4f6f9; }
header { background:#0f172a; color:#fff; padding:16px; }
h1 { margin:0; font-size:20px; }

/* Cards */
.card { background:#fff; padding:12px; margin:12px; border-radius:8px; 
        box-shadow:0 2px 6px rgba(0,0,0,0.1); }

/* Inputs */
input, select, textarea { width:100%; padding:6px; margin-top:4px;
  border-radius:6px; border:1px solid #ccc; }

/* Buttons */
button { padding:6px 12px; border-radius:6px; border:0; cursor:pointer; }
.btn-primary { background:#2563eb; color:#fff; }
.btn-secondary { background:#eef2ff; }
.btn-danger { background:#dc2626; color:#fff; }

/* Tree */
.tree-container { max-height:450px; overflow:auto; border:1px solid #ddd; padding:8px; }
ul.tree { list-style:none; padding-left:20px; }
.node { padding:6px; background:#eaf3ff; border-radius:6px; margin:4px 0; }

/* Log */
#logBox { background:#000; color:#0f0; padding:6px; font-size:12px; height:100px; overflow:auto; border-radius:6px; }

/* Advanced */
#advancedFields { display:none; }

/* Cytoscape */
#cy { width:100%; height:500px; border:1px solid #000; display:none; }

/* Diagnostics */
#diagBox { background:#111; color:#0f0; padding:6px; font-size:12px; border-radius:6px; display:none; }
</style>

</head>
<body>

<header>
  <h1>Pale Blue Dot — Relationship Mapper</h1>
</header>

<!-- =========================================================
     CONTROLS
========================================================= -->
<div class="card">

<h3>Add / Edit Person</h3>

<select id="personSelect"><option value="">— New —</option></select>

<label>Name *</label>
<input id="nameInput">

<a href="#" id="toggleAdv">Show advanced</a>

<div id="advancedFields">
  <label>Species</label>
  <select id="speciesInput">
    <option value="">Not specified</option>
    <option>Human</option>
    <option>Dog</option>
    <option>Cat</option>
    <option>Other</option>
  </select>

  <label>Gender</label>
  <select id="genderInput">
    <option value="">Not specified</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
  </select>
</div>

<label>Notes</label>
<textarea id="notesInput"></textarea>

<button class="btn-primary" id="saveBtn">Save</button>
<button class="btn-secondary" id="clearBtn">Clear</button>
<button class="btn-danger" id="deleteBtn">Delete</button>

<hr>

<h3>CSV Import</h3>
<input type="file" id="csvFile">

<button class="btn-secondary" id="previewBtn">Preview</button>
<button class="btn-primary" id="importBtn">Import</button>

<div id="csvPreview" style="display:none; margin-top:12px;">
  <h4>Preview</h4>
  <div id="previewTableBox" style="max-height:200px; overflow:auto; border:1px solid #ccc;"></div>

  <label>Map Name Column</label>
  <select id="nameCol"></select>

  <label>Map Email Column</label>
  <select id="emailCol"></select>

  <label>Map Phone Column</label>
  <select id="phoneCol"></select>
</div>

</div>


<!-- =========================================================
     TREE + VISUALIZER SECTION
========================================================= -->
<div class="card">

<h3>Tree</h3>

<select id="rootSelect"></select>
<button class="btn-secondary" id="visualizeBtn">Toggle Visualizer</button>

<div id="treeContainer" class="tree-container"></div>

<div id="cy"></div>

</div>


<!-- =========================================================
     DIAGNOSTICS + LOGS
========================================================= -->
<div class="card">
<h3>Log</h3>
<div id="logBox"></div>

<button id="diagBtn" class="btn-secondary">Run Diagnostics</button>
<div id="diagBox"></div>
</div>


<!-- =========================================================
     DEMO DATA
========================================================= -->
<div class="card">
<h3>Demo</h3>
<button class="btn-primary" id="demoBtn">Load Demo Data</button>
</div>


<!-- =========================================================
     ABOUT
========================================================= -->
<div class="card">
<button id="aboutBtn" class="btn-secondary">About</button>
</div>

<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

<script>
/* =========================================================
   GLOBAL SAFE LOGGER
========================================================= */
function log(msg){
  console.log(msg);
  const box = document.getElementById('logBox');
  if(box){
    box.textContent += msg + "\\n";
    box.scrollTop = box.scrollHeight;
  }
}

/* =========================================================
   SAFE EXEC WRAPPER
========================================================= */
function safe(fn){
  try { fn(); }
  catch(e){
    log("ERROR: " + e.message);
  }
}

/* =========================================================
   DATA STORE
========================================================= */
let people = {};
let nextId = 1;

function saveStore(){
  safe(() => {
    localStorage.setItem("PBD_STORE", JSON.stringify({people, nextId}));
    log("Saved");
  });
}

function loadStore(){
  safe(() => {
    const raw = localStorage.getItem("PBD_STORE");
    if(raw){
      const obj = JSON.parse(raw);
      people = obj.people || {};
      nextId = obj.nextId || 1;
    }
    log("Loaded");
  });
}

/* =========================================================
   RENDERERS
========================================================= */
function renderSelects(){
  safe(() => {
    const ps = document.getElementById('personSelect');
    const rs = document.getElementById('rootSelect');
    if(!ps || !rs) return;

    ps.innerHTML = '<option value="">— New —</option>';
    rs.innerHTML = '';

    Object.values(people).forEach(p=>{
      ps.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      rs.innerHTML += `<option value="${p.id}">${p.name}</option>`;
    });
  });
}

function renderTree(){
  safe(() => {
    const c = document.getElementById('treeContainer');
    const rootId = document.getElementById('rootSelect').value;
    c.innerHTML = '';

    if(!rootId || !people[rootId]) return;

    function build(id){
      const p = people[id];
      if(!p) return '';
      let html = `<li><div class="node">${p.name}</div>`;
      if(p.children && p.children.length){
        html += "<ul class='tree'>";
        p.children.forEach(ch => html += build(ch));
        html += "</ul>";
      }
      html += "</li>";
      return html;
    }

    c.innerHTML = `<ul class='tree'>${build(rootId)}</ul>`;
  });
}
/* =========================================================
   VISUALIZER
========================================================= */
let cyInstance = null;

function toggleVisualizer(){
  safe(() => {
    const div = document.getElementById('cy');
    const tree = document.getElementById('treeContainer');

    if(div.style.display === 'none' || div.style.display === ''){
      tree.style.display = 'none';
      div.style.display = 'block';
      drawCy();
    } else {
      div.style.display = 'none';
      tree.style.display = 'block';
    }
  });
}

function drawCy(){
  safe(() => {
    const elems = [];

    Object.values(people).forEach(p=>{
      elems.push({ data:{ id:"p"+p.id, label:p.name }});
      (p.children||[]).forEach(ch=>{
        elems.push({ data:{ id:"e"+p.id+"_"+ch, source:"p"+p.id, target:"p"+ch }});
      });
    });

    cyInstance = cytoscape({
      container: document.getElementById('cy'),
      elements: elems,
      layout: { name:'breadthfirst', directed:true },
      style: [
        { selector:'node', style:{ 'background-color':'#88f', 'label':'data(label)' }},
        { selector:'edge', style:{ 'width':2, 'line-color':'#bbb','target-arrow-color':'#999','target-arrow-shape':'triangle' }}
      ]
    });
  });
}

/* =========================================================
   CSV PREVIEW + IMPORT
========================================================= */
function previewCSV(){
  safe(() => {
    const file = document.getElementById('csvFile').files[0];
    if(!file){ log("No file"); return; }

    Papa.parse(file, {
      header:true,
      preview:20,
      complete: function(res){
        log("Preview ok");

        const rows = res.data;
        const headers = res.meta.fields || [];

        const box = document.getElementById('previewTableBox');
        const prev = document.getElementById('csvPreview');

        // fill preview
        let html = "<table border='1' cellpadding='4'><tr>";
        headers.forEach(h=> html += `<th>${h}</th>`);
        html += "</tr>";

        rows.forEach(r=>{
          html += "<tr>";
          headers.forEach(h => html += `<td>${r[h]||''}</td>`);
          html += "</tr>";
        });

        html += "</table>";
        box.innerHTML = html;
        prev.style.display = 'block';

        const nc = document.getElementById('nameCol');
        const ec = document.getElementById('emailCol');
        const pc = document.getElementById('phoneCol');

        nc.innerHTML = ec.innerHTML = pc.innerHTML = "";
        headers.forEach(h => {
          nc.innerHTML += `<option>${h}</option>`;
          ec.innerHTML += `<option>${h}</option>`;
          pc.innerHTML += `<option>${h}</option>`;
        });
      }
    });
  });
}

function importCSV(){
  safe(() => {
    const file = document.getElementById('csvFile').files[0];
    if(!file){ log("No file"); return; }

    const nameCol = document.getElementById('nameCol').value;
    const emailCol = document.getElementById('emailCol').value;
    const phoneCol = document.getElementById('phoneCol').value;

    Papa.parse(file, {
      header:true,
      skipEmptyLines:true,
      complete: function(res){
        log("Import start: " + res.data.length + " rows");

        res.data.forEach(r=>{
          const name = r[nameCol] || "";
          if(!name) return;

          const email = r[emailCol] || "";
          const phone = r[phoneCol] || "";

          const id = nextId++;
          people[id] = {
            id, name,
            emails: email ? [email] : [],
            phones: phone ? [phone] : [],
            children: [],
            parents: [],
            notes:""
          };
        });

        saveStore();
        renderSelects();
        renderTree();
        log("Import complete.");
      }
    });
  });
}

/* =========================================================
   DEMO DATA
========================================================= */
function loadDemo(){
  safe(() => {
    people = {};
    nextId = 1;

    const a = nextId++;
    const b = nextId++;
    const c = nextId++;

    people[a] = { id:a, name:"Alice", children:[b], parents:[], notes:"", emails:[], phones:[] };
    people[b] = { id:b, name:"Bob", children:[c], parents:[a], notes:"", emails:[], phones:[] };
    people[c] = { id:c, name:"Charlie", children:[], parents:[b], notes:"Demo child", emails:[], phones:[] };

    saveStore();
    renderSelects();
    renderTree();
    log("Demo loaded.");
  });
}

/* =========================================================
   FORM HANDLERS
========================================================= */
function savePerson(){
  safe(() => {
    const idSel = document.getElementById('personSelect').value;
    let id = idSel || nextId++;

    const name = document.getElementById('nameInput').value.trim();
    const species = document.getElementById('speciesInput').value;
    const gender = document.getElementById('genderInput').value;
    const notes = document.getElementById('notesInput').value;

    if(!name){ log("Name required"); return; }

    people[id] = people[id] || { id, children:[], parents:[], emails:[], phones:[] };

    people[id].name = name;
    people[id].species = species;
    people[id].gender = gender;
    people[id].notes = notes;

    saveStore();
    renderSelects();
    renderTree();
    log("Saved " + name);
  });
}

function clearForm(){
  safe(() => {
    document.getElementById('personSelect').value = "";
    document.getElementById('nameInput').value = "";
    document.getElementById('speciesInput').value = "";
    document.getElementById('genderInput').value = "";
    document.getElementById('notesInput').value = "";
    log("Cleared");
  });
}

function deletePerson(){
  safe(() => {
    const id = document.getElementById('personSelect').value;
    if(!id){ log("Nothing selected"); return; }

    delete people[id];

    Object.values(people).forEach(p=>{
      p.children = p.children.filter(x=>x!=id);
      p.parents = p.parents.filter(x=>x!=id);
    });

    saveStore();
    renderSelects();
    renderTree();
    log("Deleted " + id);
  });
}

/* =========================================================
   ADVANCED TOGGLE
========================================================= */
function toggleAdvanced(){
  safe(() => {
    const div = document.getElementById('advancedFields');
    div.style.display = (div.style.display === 'none') ? 'block' : 'none';
  });
}

/* =========================================================
   ABOUT
========================================================= */
function showAbout(){
  safe(() => {
    alert("Pale Blue Dot — A simple visualization tool.\nAll data stays in your browser.\nInspired by Carl Sagan.");
  });
}

/* =========================================================
   DIAGNOSTICS
========================================================= */
function runDiagnostics(){
  safe(() => {
    const box = document.getElementById('diagBox');
    box.style.display = 'block';

    const checks = {
      csvFile: !!document.getElementById('csvFile'),
      previewBtn: !!document.getElementById('previewBtn'),
      importBtn: !!document.getElementById('importBtn'),
      cyLoaded: !!window.cytoscape,
      papaLoaded: !!window.Papa,
      peopleCount: Object.keys(people).length
    };

    box.textContent = JSON.stringify(checks, null, 2);
  });
}

/* =========================================================
   INIT
========================================================= */
document.addEventListener('DOMContentLoaded', ()=>{

  loadStore();
  renderSelects();
  renderTree();

  // buttons
  document.getElementById('saveBtn').onclick = savePerson;
  document.getElementById('clearBtn').onclick = clearForm;
  document.getElementById('deleteBtn').onclick = deletePerson;

  document.getElementById('previewBtn').onclick = previewCSV;
  document.getElementById('importBtn').onclick = importCSV;

  document.getElementById('demoBtn').onclick = loadDemo;

  document.getElementById('aboutBtn').onclick = showAbout;

  document.getElementById('toggleAdv').onclick = toggleAdvanced;

  document.getElementById('visualizeBtn').onclick = toggleVisualizer;

  document.getElementById('diagBtn').onclick = runDiagnostics;

  log("Ready.");
});
</script>

</body>
</html>
